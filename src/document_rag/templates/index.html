<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document RAG</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
        background: #fafafa;
      }

      h1 {
        margin-bottom: 5px;
      }

      .section {
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 20px;
        margin-top: 20px;
      }

      button {
        padding: 9px 14px;
        cursor: pointer;
        border: 1px solid #bbb;
        border-radius: 6px;
        background: white;
      }

      button:hover {
        background: #f0f0f0;
      }

      input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      #question {
        width: 70%;
      }

      #answer {
        white-space: pre-wrap;
        line-height: 1.6;
      }

      .document {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid #eee;
      }

      .document:last-child {
        border-bottom: none;
      }

      .source {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 14px;
        margin-top: 10px;
        border-radius: 8px;
        line-height: 1.6;
      }

      .status {
        margin-top: 10px;
        font-weight: bold;
      }

      .empty {
        color: #777;
      }
      .source-text {
        margin-top: 10px;
        padding: 10px;
        border-radius: 6px;
        background: #f5f5f5;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .source-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .source-header strong {
        font-size: 16px;
      }

      .distance {
        font-size: 13px;
        color: #666;
      }

      .source-file {
        font-weight: bold;
        margin-bottom: 4px;
      }

      .source-meta {
        font-size: 13px;
        color: #666;
      }

      .source {
        transition: transform 0.15s ease;
      }
      .citation {
        border: none;
        background: none;
        padding: 0;
        margin: 0 3px;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
        text-decoration: underline;
      }

      .citation:hover {
        opacity: 0.7;
      }

      .source-highlight {
        transform: scale(1.01);
      }

      .source:hover {
        transform: translateY(-2px);
      }

      .history-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .history-item {
        border-bottom: 1px solid #e5e5e5;
        padding: 16px 0;
      }

      .history-item:last-child {
        border-bottom: none;
      }

      .history-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }

      .history-query {
        font-weight: bold;
        font-size: 15px;
        color: #1f2937;
      }

      .history-meta {
        font-size: 12px;
        color: #6b7280;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .history-badge {
        display: inline-block;
        background: #e0e7ff;
        color: #3730a3;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 4px;
      }

      .history-answer {
        margin-top: 8px;
        padding: 12px 14px;
        background: #f9fafb;
        border-radius: 6px;
        border-left: 3px solid #2563eb;
        line-height: 1.6;
        white-space: pre-wrap;
        font-size: 14px;
      }

      .history-sources {
        margin-top: 8px;
        font-size: 13px;
      }

      .history-sources summary {
        cursor: pointer;
        color: #4b5563;
        font-weight: 600;
        user-select: none;
      }

      .history-sources-list {
        margin-top: 6px;
        padding-left: 10px;
      }

      .history-source-item {
        background: #f3f4f6;
        padding: 8px 10px;
        border-radius: 4px;
        margin-bottom: 6px;
        font-size: 12px;
        line-height: 1.4;
      }
    </style>
  </head>

  <body>
    <h1>Document RAG</h1>

    <p>Upload documents and ask questions about them.</p>

    <div class="section">
      <h2>Upload Document</h2>

      <input type="file" id="file" accept=".pdf,.docx,.txt" />

      <button onclick="uploadDocument()">Upload</button>

      <div id="uploadStatus" class="status"></div>
    </div>

    <div class="section">
      <h2>Documents</h2>

      <div id="documents">Loading...</div>
    </div>

    <div class="section">
      <h2>Ask a Question</h2>

      <label for="documentSelect"> Document: </label>

      <select id="documentSelect">
        <option value="">All documents</option>
      </select>

      <br /><br />

      <input
        type="text"
        id="question"
        placeholder="Ask something about your documents..."
      />

      <button onclick="askQuestion()">Ask</button>
    </div>

    <div class="section">
      <h2>Answer</h2>

      <div id="answer">No question asked yet.</div>
    </div>

    <div class="section">
      <h2>Sources</h2>

      <div id="sources">No sources yet.</div>
    </div>

    <div class="section">
      <div class="history-header-bar">
        <h2>Chat History (Memory)</h2>
        <button onclick="clearChatHistory()" id="clearHistoryBtn">Clear History</button>
      </div>

      <div id="chatHistory">Loading memory...</div>
    </div>

    <script>
      async function uploadDocument() {
        const fileInput = document.getElementById("file");

        const status = document.getElementById("uploadStatus");

        if (!fileInput.files.length) {
          status.textContent = "Please select a file.";

          return;
        }

        const formData = new FormData();

        formData.append("file", fileInput.files[0]);

        status.textContent = "Uploading...";

        try {
          const response = await fetch("/upload", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (!response.ok) {
            status.textContent = data.error;

            return;
          }

          status.textContent =
            `${data.file_name} uploaded successfully. ` +
            `${data.chunks_indexed} chunks indexed.`;

          fileInput.value = "";

          loadDocuments();
        } catch (error) {
          status.textContent = "Upload failed.";

          console.error(error);
        }
      }

      async function loadDocuments() {
        const container = document.getElementById("documents");

        try {
          const response = await fetch("/documents");

          const data = await response.json();

          container.innerHTML = "";

          if (!data.documents.length) {
            container.innerHTML =
              '<div class="empty">No documents indexed.</div>';

            return;
          }

          for (const doc of data.documents) {
            const div = document.createElement("div");

            div.className = "document";

            div.innerHTML = `
                    <div>
                        <strong>
                            ${doc.file_name}
                        </strong>

                        <br>

                        <small>
                            ${doc.file_type}
                            ·
                            ${doc.chunks} chunks
                        </small>
                    </div>

                    <button
                        onclick="deleteDocument(
                            '${encodeURIComponent(doc.file_name)}'
                        )">
                        Delete
                    </button>
                `;

            container.appendChild(div);
          }
        } catch (error) {
          container.textContent = "Could not load documents.";

          console.error(error);
        }
      }

      async function deleteDocument(fileName) {
        if (!confirm("Delete this document?")) {
          return;
        }

        try {
          const response = await fetch(`/documents/${fileName}`, {
            method: "DELETE",
          });

          const data = await response.json();

          if (!response.ok) {
            alert(data.error || "Delete failed.");

            return;
          }

          loadDocuments();
        } catch (error) {
          alert("Delete failed.");

          console.error(error);
        }
      }
      async function loadDocumentSelector() {
        const select = document.getElementById("documentSelect");

        try {
          const response = await fetch("/documents");

          const data = await response.json();

          select.innerHTML = `
                  <option value="">All documents</option>
                `;

          for (const doc of data.documents) {
            const option = document.createElement("option");

            option.value = doc.file_path;

            option.textContent = doc.file_name;

            select.appendChild(option);
          }
        } catch (error) {
          console.error("Could not load document selector:", error);
        }
      }
      function renderAnswerWithCitations(text) {
        const answer = document.getElementById("answer");

        answer.innerHTML = "";

        const parts = text.split(/(\[Source\s+\d+\])/g);

        for (const part of parts) {
          const match = part.match(/^\[Source\s+(\d+)\]$/);

          if (match) {
            const button = document.createElement("button");

            button.className = "citation";
            button.type = "button";
            button.textContent = `Source ${match[1]}`;

            button.addEventListener("click", () => {
              const source = document.getElementById(`source-${match[1]}`);

              if (source) {
                source.scrollIntoView({
                  behavior: "smooth",
                  block: "center",
                });

                source.classList.add("source-highlight");

                setTimeout(() => {
                  source.classList.remove("source-highlight");
                }, 1200);
              }
            });

            answer.appendChild(button);
          } else {
            answer.appendChild(document.createTextNode(part));
          }
        }
      }
      async function askQuestion() {
        const questionInput = document.getElementById("question");
        const documentSelect = document.getElementById("documentSelect");

        const question = questionInput.value.trim();
        const selectedFile = documentSelect.value;

        const answer = document.getElementById("answer");
        const sources = document.getElementById("sources");

        if (!question) {
          answer.textContent = "Please enter a question.";
          return;
        }

        answer.textContent = "Thinking...";
        sources.innerHTML = "Searching documents...";

        try {
          const response = await fetch("/ask", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              query: question,
              file_path: selectedFile || null,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            answer.textContent = data.error || "Something went wrong.";
            sources.innerHTML = "No sources.";
            return;
          }

          renderAnswerWithCitations(data.answer);

          sources.innerHTML = "";

          if (!data.sources || data.sources.length === 0) {
            sources.innerHTML =
              '<div class="empty">No relevant sources found.</div>';

            return;
          }

          for (const source of data.sources) {
            const div = document.createElement("div");

            div.className = "source";
            div.id = `source-${source.source_number}`;
            const metadata = source.metadata || {};

            const fileName =
              metadata.file_name || metadata.file_path || "Unknown file";

            const chunk = metadata.chunk_index ?? "Unknown";

            const page = metadata.page_number;

            const distance = source.distance;
            const text = source.text || "No source text available.";
            div.innerHTML = `
              <div class="source-header">
                <strong>
                  Source ${source.source_number}
                </strong>

                <span class="distance">
                  Distance:
                  ${distance !== undefined ? distance.toFixed(4) : "N/A"}
                </span>
              </div>

              <div class="source-file">
                ${fileName}
              </div>

              <div class="source-meta">
                Chunk: ${chunk}
                ${page ? ` · Page: ${page}` : ""}
              </div>
              <div class="source-text">
                ${text}
              </div>
            `;

            sources.appendChild(div);
          }

          loadHistory();
        } catch (error) {
          console.error("Ask error:", error);

          answer.textContent = "Request failed. Please try again.";

          sources.innerHTML =
            '<div class="empty">Could not load sources.</div>';
        }
      }

      function escapeHtml(text) {
        if (!text) return "";
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      async function loadHistory() {
        const container = document.getElementById("chatHistory");

        try {
          const response = await fetch("/history");
          const data = await response.json();

          container.innerHTML = "";

          if (!data.history || data.history.length === 0) {
            container.innerHTML =
              '<div class="empty">No search memory recorded yet.</div>';
            return;
          }

          const reversed = [...data.history].reverse();

          for (const item of reversed) {
            const div = document.createElement("div");
            div.className = "history-item";

            const fileName = item.file_path
              ? item.file_path.split("/").pop()
              : "All documents";

            let sourcesHtml = "";
            if (item.sources && item.sources.length > 0) {
              const sourceCards = item.sources
                .map(
                  (s) => `
                    <div class="history-source-item">
                      <strong>Source ${s.source_number}:</strong> ${
                        escapeHtml(s.metadata?.file_name || s.metadata?.file_path || "Document")
                      } (Chunk ${s.metadata?.chunk_index ?? "N/A"})
                      <br>
                      <em>${escapeHtml((s.text || "").substring(0, 150))}${(s.text || "").length > 150 ? "..." : ""}</em>
                    </div>
                  `
                )
                .join("");

              sourcesHtml = `
                <details class="history-sources">
                  <summary>${item.sources.length} source(s) referenced</summary>
                  <div class="history-sources-list">
                    ${sourceCards}
                  </div>
                </details>
              `;
            }

            div.innerHTML = `
              <div class="history-top">
                <span class="history-query">Q: ${escapeHtml(item.query)}</span>
                <span class="history-meta">
                  <span class="history-badge">${escapeHtml(fileName)}</span>
                  <span>${escapeHtml(item.timestamp || "")}</span>
                </span>
              </div>
              <div class="history-answer">${escapeHtml(item.answer || "")}</div>
              ${sourcesHtml}
            `;

            container.appendChild(div);
          }
        } catch (error) {
          console.error("Failed to load chat history:", error);
          container.textContent = "Could not load chat history.";
        }
      }

      async function clearChatHistory() {
        if (!confirm("Are you sure you want to clear the chat memory?")) {
          return;
        }

        try {
          const response = await fetch("/history", {
            method: "DELETE",
          });

          if (!response.ok) {
            alert("Failed to clear memory.");
            return;
          }

          loadHistory();
        } catch (error) {
          console.error("Clear memory error:", error);
          alert("Failed to clear memory.");
        }
      }

      loadDocuments();
      loadDocumentSelector();
      loadHistory();
    </script>
  </body>
</html>
